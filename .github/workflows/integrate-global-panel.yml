name: Integrate global panel

on:
  push:
    paths:
      - '.github/workflows/integrate-global-panel.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject global panel into index.html
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          marker = '<!-- GLOBAL_PANEL_INTEGRATION_V1 -->'
          if marker in text:
              print('Global panel already integrated')
              raise SystemExit(0)
          block = r'''\n<!-- GLOBAL_PANEL_INTEGRATION_V1 -->\n<style>\n.global-integration{margin:0 0 24px;padding:18px;border:1px solid #263247;border-radius:18px;background:linear-gradient(180deg,#111827,#0b1018)}\n.global-integration-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-top:14px}\n.global-integration-card{padding:12px;border:1px solid #263247;border-radius:12px;background:#080d16}\n.global-integration-muted{font-size:11px;color:#94a3b8}\n.global-integration-value{font-size:18px;font-weight:800;color:#e5e7eb;margin-top:4px}\n</style>\n<section id="globalIntegrationPanel" class="global-integration" aria-label="Panel global integrado">\n  <div style="display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap">\n    <div>\n      <div style="font-size:11px;letter-spacing:.12em;color:#60a5fa;font-weight:800">PANEL GLOBAL · INTEGRADO EN LA APP PRINCIPAL</div>\n      <h2 style="font-size:22px;font-weight:900;color:#fff;margin-top:4px">Riesgo, sentimiento y módulos profesionales</h2>\n      <p class="global-integration-muted" style="margin-top:4px">Estructura preparada para conectar feeds/API sin inventar datos. Los campos sin fuente aparecen como no disponibles.</p>\n    </div>\n    <span class="mini-pill">API-ready · feed 15 min</span>\n  </div>\n  <div class="global-integration-grid">\n    <div class="global-integration-card"><div class="global-integration-muted">Mercado tradicional · Fear & Greed</div><div class="global-integration-value">No disponible</div><div class="global-integration-muted">Fuente pendiente de feed verificado</div></div>\n    <div class="global-integration-card"><div class="global-integration-muted">Cripto · Fear & Greed</div><div class="global-integration-value">No disponible</div><div class="global-integration-muted">Histórico 90d / 1a / máximo preparado</div></div>\n    <div class="global-integration-card"><div class="global-integration-muted">Risk On / Off</div><div class="global-integration-value">Mixto</div><div class="global-integration-muted">Se calculará con confirmaciones cruzadas</div></div>\n    <div class="global-integration-card"><div class="global-integration-muted">Opciones / Dark pools / COT</div><div class="global-integration-value">Pendiente de fuente</div><div class="global-integration-muted">Sin valores ficticios; fecha de publicación obligatoria</div></div>\n  </div>\n</section>\n<script>\n(function(){\n  function mount(){\n    const host=document.getElementById('mainDashboard');\n    const panel=document.getElementById('globalIntegrationPanel');\n    if(host && panel && panel.parentElement!==host){host.prepend(panel);}\n  }\n  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',()=>setTimeout(mount,900));\n  else setTimeout(mount,900);\n})();\n</script>\n'''
          needle = '</body>'
          if needle not in text:
              raise SystemExit('No se encontró </body>')
          p.write_text(text.replace(needle, block + '\n' + needle, 1), encoding='utf-8')
          print('Global panel injected')
          PY

      - name: Commit integration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'feat: integrate global panel into index.html'
          git push
