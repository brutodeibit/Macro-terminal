name: Update professional market feeds

on:
  workflow_dispatch:
  schedule:
    # COT: official weekly report refresh window (Friday/Saturday UTC)
    - cron: "30 20 * * 5"
    # Options / dark pools: daily refresh; scripts can later be given intraday schedules
    - cron: "15 22 * * 1-5"

permissions:
  contents: write

# Share the same repository-wide writer lock with the other feed workflows.
concurrency:
  group: macroterminal-main-writer
  cancel-in-progress: false

jobs:
  update-professional-feeds:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate collectors
        run: |
          python -m py_compile scripts/cot.py
          if [ -f scripts/options.py ]; then python -m py_compile scripts/options.py; fi
          if [ -f scripts/darkpools.py ]; then python -m py_compile scripts/darkpools.py; fi

      - name: Update CFTC COT feed
        run: python scripts/cot.py

      - name: Update options feed when collector is available
        if: ${{ hashFiles('scripts/options.py') != '' }}
        env:
          OPTIONWHALES_API_KEY: ${{ secrets.OPTIONWHALES_API_KEY }}
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
        run: python scripts/options.py

      - name: Update dark pools feed when collector is available
        if: ${{ hashFiles('scripts/darkpools.py') != '' }}
        env:
          FINRA_API_CLIENT_ID: ${{ secrets.FINRA_API_CLIENT_ID }}
          FINRA_API_CLIENT_SECRET: ${{ secrets.FINRA_API_CLIENT_SECRET }}
          FINRA_API_TOKEN: ${{ secrets.FINRA_API_TOKEN }}
        run: python scripts/darkpools.py

      - name: Commit feed changes safely
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh professional market feeds"
          for i in 1 2 3; do
            git fetch origin main
            git rebase origin/main && git push origin HEAD:main && exit 0
            git rebase --abort || true
            sleep 5
          done
          echo "Unable to publish after 3 attempts"
          exit 1
