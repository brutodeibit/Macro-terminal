name: Update statistical monitor
on:
  workflow_dispatch:
  schedule:
    - cron: "20 6 * * 1-5"
    - cron: "20 16 * * 1-5"
permissions:
  contents: write

# Share the same repository-wide writer lock with all feed workflows.
concurrency:
  group: macroterminal-main-writer
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - run: python -m py_compile update_stats.py
      - run: python update_stats.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats-feed.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh statistical monitor"
          for i in 1 2 3; do
            git fetch origin main
            git rebase origin/main && git push origin HEAD:main && exit 0
            git rebase --abort || true
            sleep 5
          done
          echo "Unable to publish after 3 attempts"
          exit 1
