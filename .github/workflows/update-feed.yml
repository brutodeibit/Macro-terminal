name: Update MacroTerminal feed

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "macro-feed.json"
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: macroterminal-main-writer
  cancel-in-progress: false

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate Python
        run: python -m py_compile update_feed.py market_features.py maintenance/fix_ui_2026_10_02.py maintenance/fix_options_feed_2026_10_03.py

      - name: Apply dashboard UI fixes
        run: python maintenance/fix_ui_2026_10_02.py

      - name: Apply options feed fixes
        run: python maintenance/fix_options_feed_2026_10_03.py

      - name: Update feed
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          TE_API_KEY: ${{ secrets.TE_API_KEY }}
          FINRA_API_CLIENT_ID: ${{ secrets.FINRA_API_CLIENT_ID }}
          FINRA_API_CLIENT_SECRET: ${{ secrets.FINRA_API_CLIENT_SECRET }}
          FINRA_API_TOKEN: ${{ secrets.FINRA_API_TOKEN }}
          OPTIONWHALES_API_KEY: ${{ secrets.OPTIONWHALES_API_KEY }}
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
        run: python update_feed.py

      - name: Validate generated feed
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('macro-feed.json')
          if not p.exists() or p.stat().st_size < 1000:
              raise SystemExit('ABORT: macro-feed.json is missing or suspiciously small')
          data=json.loads(p.read_text(encoding='utf-8'))
          economies=data.get('economies')
          if not isinstance(economies, dict) or len(economies) < 3:
              raise SystemExit('ABORT: generated feed has no usable economies')
          opts=data.get('options')
          if not isinstance(opts,dict) or not isinstance(opts.get('markets'),list) or not opts.get('markets'):
              raise SystemExit('ABORT: generated options feed is missing')
          tickers={str(x.get('ticker') or x.get('instrumentCode') or '').upper() for x in opts['markets'] if isinstance(x,dict)}
          if not {'BTC','ETH','IBIT'}.issubset(tickers):
              raise SystemExit('ABORT: BTC/ETH/IBIT options instruments missing from generated feed')
          catalog={str(x.get('code') or '').upper() for x in opts.get('catalog',[]) if isinstance(x,dict)}
          if 'IBIT' not in catalog:
              raise SystemExit('ABORT: IBIT absent from options catalog')
          sentiment=data.get('traditionalSentiment',{})
          vals=[sentiment.get(k) for k in ('bullishPct','neutralPct','bearishPct')]
          if any(not isinstance(v,(int,float)) for v in vals) or abs(sum(vals)-100)>1.2:
              raise SystemExit('ABORT: AAII bullish/neutral/bearish percentages invalid or missing')
          if len(sentiment.get('history',[]))<2:
              raise SystemExit('ABORT: AAII weekly history must include previous observations')
          dp=data.get('darkPoolPrints',{})
          assets=dp.get('assets',{}) if isinstance(dp,dict) else {}
          if not isinstance(assets,dict) or not assets:
              raise SystemExit('ABORT: dark-pool feed would be blank; retain last valid snapshot')
          if not any(len((x or {}).get('priceSeries',[]))>=2 for x in assets.values() if isinstance(x,dict)):
              raise SystemExit('ABORT: dark-pool feed has no usable price history; retain last valid snapshot')
          print('Feed validation OK:', p.stat().st_size, 'bytes;', len(economies), 'economies;', len(opts['markets']), 'option markets; BTC/ETH/IBIT present; AAII % and history valid; dark-pool price history valid')
          PY

      - name: Validate dashboard JavaScript and UI markers
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script[^>]*>([\s\S]*?)</script>',s,re.I)
          if not scripts:
              raise SystemExit('ABORT: no inline dashboard script found')
          Path('/tmp/macroterminal.js').write_text(scripts[-1],encoding='utf-8')
          print('Inline JS extracted:', len(scripts[-1]), 'chars')
          PY
          node --check /tmp/macroterminal.js
          python - <<'PY'
          from pathlib import Path
          js=Path('/tmp/macroterminal.js').read_text(encoding='utf-8')
          assert 'const __renderCotLegacy=renderCotSection;' not in js, 'COT overlay still present'
          assert "const explicitCrypto=(selected==='BTC'||selected==='ETH');" in js, 'BTC/ETH isolation marker missing'
          assert "const first=__optionsChainMarket(markets)" not in js, 'Options selector still forces fallback to the first chain'
          assert "const selected=current?(current.ticker||current.instrumentCode):wanted;" in js, 'Options selector does not preserve missing/reference-only assets'
          assert "function __optionsInteractiveHtml(m,p)" in js, 'Options chart container missing'
          assert "Solo hay '+term.length+' vencimiento(s)" in js, 'Options term-structure empty state missing'
          assert "setTimeout(()=>__drawOptionsCharts(m,p),80)" in js, 'Options charts are not scheduled for every selected asset'
          assert "weeklyHist" in js, 'Traditional Fear & Greed weekly history missing'
          assert "AAII · ALCISTAS / NEUTRALES / BAJISTAS" in js, 'AAII percentage panel missing below traditional Fear & Greed'
          assert "aaiiHistoryRows" in js and "Últimas semanas · encuesta AAII" in js, 'AAII weekly survey history missing'
          assert "families.includes(requestedFamily)" in js, 'Options family selection is not preserved'
          assert "Estado del feed:" in js, 'Dark-pool freshness status missing'
          assert "change3d" in js and "changeYtd" in js, 'Rotation 3-session/YTD windows missing'
          assert "function renderWeeklyFxRadar(data)" in js, 'Weekly FX Radar missing from economy panels'
          assert "Plan de la semana · hipótesis y revisión" in js, 'Weekly FX baseline/revision summary missing'
          assert "Amplitud y dispersión" in js, 'Traditional market breadth context missing beside Fear & Greed'
          assert "marketBreadth:'__marketBreadth'" in js, 'S&P 500 breadth feed mapping missing'
          assert "const ndxBreadth=marketBreadth.nasdaq100||{};" in js, 'Nasdaq-100 breadth snapshot not wired into UI'
          assert "Nasdaq-100 · suben / bajan" in js, 'Nasdaq-100 advance/decline counts missing beside Fear & Greed'
          assert "Flujos netos BTC / ETH" in js, 'ETF flow panel missing'
          assert "farside.co.uk/bitcoin-etf-flow-all-data/" in js, 'Bitcoin ETF flow source link missing'
          assert "Solo hay '+term.length+' vencimiento(s)" in js, 'Options term-structure validation missing'
          assert "def _cboe_option_chain(sym):" in source, 'Cboe public options fallback missing'
          assert "bitcoin-etf-flow-all-data" in source, 'Farside BTC flow endpoint missing'
          assert "Cboe public delayed chain is a no-key fallback" in Path('maintenance/fix_options_feed_2026_10_03.py').read_text(encoding='utf-8'), 'Cboe fallback loop must persist across scheduled runs'
          assert "tr3:nval(m.change3s)" in js and "tr21:nval(m.change21s)" in js and "tytd:nval(m.changeYtd)" in js, 'FX comparator must use 3S/5S/21S/YTD returns'
          assert "d.id!=='de'" in js, 'FX comparator must not let Germany overwrite the Euro Area currency row'
          assert "fmtNum(shortBp,1)+' pb'" in js, 'Weekly FX radar must display yield changes as basis points, not percent'
          assert "function expectationsAreFresh(data,maxAgeDays=7)" in js, 'Rate expectations need a verifiable freshness timestamp'
          assert "Probabilidades no verificadas" in js and "no se ponderan" in js, 'Stale market-implied probabilities must not be presented as current'
          source=Path('market_features.py').read_text(encoding='utf-8')
          assert 't[target]=round(raw*100,2) if raw is not None else None' in source, 'Bond yield changes are not normalized to basis points'
          assert "SIN DATO VÁLIDO" in js, 'Fear & Greed invalid/missing score must not display as zero'
          assert "oiCoveragePct" in js and "ivCoveragePct" in js, 'Options chain data coverage transparency missing'
          assert "function fmtNum(v,d=2){ if(v===null||v===undefined||v==='')return '—';" in js, 'Null numeric values must not render as zero'
          print('Dashboard UI validation OK: weekly FX radar/revisions, sentiment null-safety/breadth, option coverage, AAII history, dark-pool status and rotation windows')
          PY

      - name: Commit feed and UI changes safely
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html macro-feed.json maintenance/fix_ui_2026_10_02.py maintenance/fix_options_feed_2026_10_03.py .github/workflows/update-feed.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix: resilient options feed and asset isolation"
          for i in 1 2 3; do
            git fetch origin main
            if git rebase origin/main; then
              :
            else
              git rebase --abort || true
              git reset --hard origin/main
              python maintenance/fix_ui_2026_10_02.py
              python maintenance/fix_options_feed_2026_10_03.py
              python update_feed.py
              git add index.html macro-feed.json maintenance/fix_ui_2026_10_02.py maintenance/fix_options_feed_2026_10_03.py .github/workflows/update-feed.yml
              git commit -m "fix: resilient options feed and asset isolation" --allow-empty
            fi
            if git push origin HEAD:main; then exit 0; fi
            sleep 5
          done
          echo "Unable to publish after 3 attempts"
          exit 1
