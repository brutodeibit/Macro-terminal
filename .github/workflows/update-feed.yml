name: Update MacroTerminal feed
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['update_feed.py', 'market_features.py', 'data_integrity.py', 'requirements.txt', '.github/workflows/update-feed.yml']
  schedule:
    - cron: '45 */6 * * *'
permissions:
  contents: write
concurrency:
  group: macroterminal-main-writer
  cancel-in-progress: false
jobs:
  update-feed:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Test financial transforms and parsers
        run: python -m unittest discover -s tests -v
      - name: Test dashboard behavior
        run: node tests/dashboard-runtime.cjs
      - name: Update feed
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          TE_API_KEY: ${{ secrets.TE_API_KEY }}
          FINRA_API_CLIENT_ID: ${{ secrets.FINRA_API_CLIENT_ID }}
          FINRA_API_CLIENT_SECRET: ${{ secrets.FINRA_API_CLIENT_SECRET }}
          FINRA_API_TOKEN: ${{ secrets.FINRA_API_TOKEN }}
          OPTIONWHALES_API_KEY: ${{ secrets.OPTIONWHALES_API_KEY }}
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
          MACRO_INTERVAL_MINUTES: '360'
        run: python -u update_feed.py
      - name: Validate snapshot
        run: python validate_feed.py
      - name: Publish data only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- macro-feed.json
          git diff --cached --quiet && exit 0
          git commit -m 'data: refresh MacroTerminal source snapshot'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
