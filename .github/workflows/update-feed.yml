name: Update MacroTerminal feed

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Update feed
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          TE_API_KEY: ${{ secrets.TE_API_KEY }}
          FINRA_API_TOKEN: ${{ secrets.FINRA_API_TOKEN }}
        run: python update_feed.py
      - name: Commit feed changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add macro-feed.json
          git diff --cached --quiet || git commit -m "chore: refresh macro feed"
          git push
