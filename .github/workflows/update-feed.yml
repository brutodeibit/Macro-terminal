name: Update MacroTerminal feed

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - "macro-feed.json"
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

# All writers use the same lock so generated feeds cannot race on main.
concurrency:
  group: macroterminal-main-writer
  cancel-in-progress: false

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate Python
        run: python -m py_compile update_feed.py market_features.py

      - name: Update feed
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          TE_API_KEY: ${{ secrets.TE_API_KEY }}
          FINRA_API_CLIENT_ID: ${{ secrets.FINRA_API_CLIENT_ID }}
          FINRA_API_CLIENT_SECRET: ${{ secrets.FINRA_API_CLIENT_SECRET }}
          FINRA_API_TOKEN: ${{ secrets.FINRA_API_TOKEN }}
          OPTIONWHALES_API_KEY: ${{ secrets.OPTIONWHALES_API_KEY }}
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
        run: python update_feed.py

      - name: Commit feed changes safely
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add macro-feed.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh macro feed"
          for i in 1 2 3; do
            git fetch origin main
            git rebase origin/main && git push origin HEAD:main && exit 0
            git rebase --abort || true
            sleep 5
          done
          echo "Unable to publish after 3 attempts"
          exit 1
