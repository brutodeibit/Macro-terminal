name: Update MacroTerminal feed

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "macro-feed.json"
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: macroterminal-main-writer
  cancel-in-progress: false

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate Python
        run: python -m py_compile update_feed.py market_features.py maintenance/fix_ui_2026_10_02.py

      - name: Apply dashboard UI fixes
        run: python maintenance/fix_ui_2026_10_02.py

      - name: Update feed
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          TE_API_KEY: ${{ secrets.TE_API_KEY }}
          FINRA_API_CLIENT_ID: ${{ secrets.FINRA_API_CLIENT_ID }}
          FINRA_API_CLIENT_SECRET: ${{ secrets.FINRA_API_CLIENT_SECRET }}
          FINRA_API_TOKEN: ${{ secrets.FINRA_API_TOKEN }}
          OPTIONWHALES_API_KEY: ${{ secrets.OPTIONWHALES_API_KEY }}
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
        run: python update_feed.py

      - name: Validate generated feed
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('macro-feed.json')
          if not p.exists() or p.stat().st_size < 1000:
              raise SystemExit('ABORT: macro-feed.json is missing or suspiciously small')
          data=json.loads(p.read_text(encoding='utf-8'))
          economies=data.get('economies')
          if not isinstance(economies, dict) or len(economies) < 3:
              raise SystemExit('ABORT: generated feed has no usable economies')
          print('Feed validation OK:', p.stat().st_size, 'bytes;', len(economies), 'economies')
          PY

      - name: Validate dashboard JavaScript and UI markers
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script[^>]*>([\s\S]*?)</script>',s,re.I)
          if not scripts:
              raise SystemExit('ABORT: no inline dashboard script found')
          Path('/tmp/macroterminal.js').write_text(scripts[-1],encoding='utf-8')
          # The browser executes JavaScript, so validate with Node rather than
          # Python's parser (which was previously giving false confidence).
          print('Inline JS extracted:', len(scripts[-1]), 'chars')
          PY
          node --check /tmp/macroterminal.js
          python - <<'PY'
          from pathlib import Path
          js=Path('/tmp/macroterminal.js').read_text(encoding='utf-8')
          assert 'const __renderCotLegacy=renderCotSection;' not in js, 'COT overlay still present'
          assert "const explicitCrypto=(selected==='BTC'||selected==='ETH');" in js, 'BTC/ETH isolation marker missing'
          print('Dashboard UI validation OK')
          PY

      - name: Commit feed and UI changes safely
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html macro-feed.json maintenance/fix_ui_2026_10_02.py .github/workflows/update-feed.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix: clean COT chart and isolate BTC ETH options"
          for i in 1 2 3; do
            git fetch origin main
            if git rebase origin/main; then
              :
            else
              git rebase --abort || true
              git reset --hard origin/main
              python maintenance/fix_ui_2026_10_02.py
              python update_feed.py
              git add index.html macro-feed.json maintenance/fix_ui_2026_10_02.py .github/workflows/update-feed.yml
              git commit -m "fix: clean COT chart and isolate BTC ETH options" --allow-empty
            fi
            if git push origin HEAD:main; then exit 0; fi
            sleep 5
          done
          echo "Unable to publish after 3 attempts"
          exit 1
