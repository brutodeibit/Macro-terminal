name: Update MacroTerminal feed

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - "macro-feed.json"
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: macroterminal-feed
  cancel-in-progress: true

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate Python
        run: |
          python -m py_compile update_feed.py market_features.py
          python -c "import market_features; print('market_features import OK')"
      - name: Update feed
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          TE_API_KEY: ${{ secrets.TE_API_KEY }}
          FINRA_API_CLIENT_ID: ${{ secrets.FINRA_API_CLIENT_ID }}
          FINRA_API_CLIENT_SECRET: ${{ secrets.FINRA_API_CLIENT_SECRET }}
          FINRA_API_TOKEN: ${{ secrets.FINRA_API_TOKEN }}
        run: python update_feed.py
      - name: Commit feed changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add macro-feed.json
          if git diff --cached --quiet; then
            echo "No feed changes"
            exit 0
          fi
          git commit -m "chore: refresh macro feed"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            echo "Push conflict, retrying..."
            git rebase --abort || true
            sleep 2
          done
          echo "Unable to push feed after retries"
          exit 1
