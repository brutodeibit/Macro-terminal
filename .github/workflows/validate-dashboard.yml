name: Validate MacroTerminal dashboard
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "validate_dashboard.py"
  pull_request:
    branches: [main]
    paths:
      - "index.html"
      - "validate_dashboard.py"
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python validate_dashboard.py
