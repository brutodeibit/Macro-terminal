name: Validate MacroTerminal dashboard
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "validate_dashboard.py"
      - "design-preview-v2.js"
      - "design-preview-v2.css"
      - "v7-ui.js"
      - "tests/dashboard-runtime.cjs"
      - "tests/chart-config.cjs"
      - "market_features.py"
      - "v7_option_retention.py"
      - "tests/test_option_recovery.py"
      - "tests/options-recovery.cjs"
      - ".github/workflows/validate-dashboard.yml"
  pull_request:
    branches: [main]
    paths:
      - "index.html"
      - "validate_dashboard.py"
      - "design-preview-v2.js"
      - "design-preview-v2.css"
      - "v7-ui.js"
      - "tests/dashboard-runtime.cjs"
      - "tests/chart-config.cjs"
      - "market_features.py"
      - "v7_option_retention.py"
      - "tests/test_option_recovery.py"
      - "tests/options-recovery.cjs"
      - ".github/workflows/validate-dashboard.yml"
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python validate_dashboard.py
      - run: pip install -r requirements.txt
      - run: python -m py_compile market_features.py v7_option_retention.py
      - run: python -m unittest discover -s tests -q
      - run: node --check design-preview-v2.js
      - run: node tests/dashboard-runtime.cjs
      - run: node tests/chart-config.cjs
      - run: node tests/options-recovery.cjs
