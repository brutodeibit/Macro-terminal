name: Validate MacroTerminal dashboard
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "validate_dashboard.py"
      - "design-preview-v2.js"
      - "design-preview-v2.css"
      - "v7-ui.js"
      - "source-refresh.js"
      - "tests/dashboard-runtime.cjs"
      - "tests/chart-config.cjs"
  pull_request:
    branches: [main]
    paths:
      - "index.html"
      - "validate_dashboard.py"
      - "design-preview-v2.js"
      - "design-preview-v2.css"
      - "v7-ui.js"
      - "source-refresh.js"
      - "tests/dashboard-runtime.cjs"
      - "tests/chart-config.cjs"
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python validate_dashboard.py
      - run: node --check design-preview-v2.js
      - run: node --check source-refresh.js
      - run: node tests/dashboard-runtime.cjs
      - run: node tests/chart-config.cjs
