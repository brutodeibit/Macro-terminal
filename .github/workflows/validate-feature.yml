name: Validate MacroTerminal feature branch

on:
  push:
    branches:
      - feature/cot-dark-options-ytd-20260926

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Python syntax
        run: python -m py_compile market_features.py update_feed.py update_stats.py
      - name: JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          Path('/tmp/index-inline.js').write_text('\n\n'.join(blocks),encoding='utf-8')
          print('inline script blocks:',len(blocks))
          PY
          node --check /tmp/index-inline.js