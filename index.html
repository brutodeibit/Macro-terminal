        .sidebar { background-color: #0d111a; border-right: 1px solid #1a2333; }
        .sidebar { position: sticky; top: 0; height: 100vh; overflow-y: auto; }
        .nav-item.active { background-color: #1a2333; color: #ffffff; border-left: 3px solid #3b82f6; }
        .badge-hawkish { background-color: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }
        .badge-dovish { background-color: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
        .badge-neutral { background-color: rgba(245, 158, 11, 0.15); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.3); }
        .tab-btn.active { border-bottom: 2px solid #3b82f6; color: #ffffff; }

        html { scroll-behavior: smooth; }
        .glass { background: linear-gradient(180deg, rgba(17,22,34,.96), rgba(13,17,26,.96)); border: 1px solid #1a2333; }
        .metric { background: rgba(9,12,18,.72); border:1px solid #1b2432; }
        .mini-pill { font-size:10px; padding:.22rem .5rem; border-radius:999px; border:1px solid #273244; background:#0b1018; color:#9ca3af; }
        .bias-up { color:#34d399; } .bias-down { color:#f87171; } .bias-flat { color:#fbbf24; }
        .source-link { color:#60a5fa; } .source-link:hover { color:#93c5fd; text-decoration:underline; }
        .meeting-current { border-color: rgba(59,130,246,.55); box-shadow: inset 0 0 0 1px rgba(59,130,246,.08); }
        .meeting-old { opacity:.9; }
        .row-hover:hover { background: rgba(15,23,42,.55); }
    
        .curve-wrap { background: rgba(3,7,18,.55); border:1px solid #1f2937; border-radius:16px; padding:14px; }
        .curve-svg { width:100%; height:300px; display:block; }
        .curve-grid { stroke:#273244; stroke-width:1; stroke-dasharray:3 5; }
        .curve-axis { fill:#6b7280; font-size:10px; }
        .curve-line { fill:none; stroke:#60a5fa; stroke-width:3; stroke-linecap:round; stroke-linejoin:round; }
        .curve-dot { fill:#93c5fd; stroke:#0f172a; stroke-width:2; }
        .effect-hawkish { color:#f87171; }
        .effect-dovish { color:#34d399; }
        .effect-neutral { color:#fbbf24; }
        .score-chip { border:1px solid #1f2937; background:rgba(17,24,39,.65); border-radius:999px; padding:4px 8px; font-size:10px; }

    
        .risk-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;}
        .risk-meter{height:16px;border-radius:999px;background:#172033;border:1px solid #273244;overflow:hidden;}
        .risk-meter-fill{height:100%;transition:width .5s ease;}
        .risk-cell{background:rgba(5,9,18,.65);border:1px solid #1e293b;border-radius:14px;padding:12px;}
        .risk-up{color:#34d399}.risk-down{color:#f87171}.risk-neutral{color:#fbbf24}
        .risk-badge{font-size:10px;border-radius:999px;padding:4px 8px;border:1px solid #273244;background:#0b1018;color:#cbd5e1;}
        .risk-alert{border-left:3px solid #f59e0b;background:rgba(245,158,11,.06);}

        let currentCountryKey = '__global';

        function renderSidebar() {
            const nav = document.getElementById('countryNav');
            const mobileSelect = document.getElementById('mobileCountrySelect');
            nav.innerHTML = '';
            mobileSelect.innerHTML = '';

            const globalBtn=document.createElement('button');
            globalBtn.className=`w-full flex items-center justify-between px-3 py-2.5 rounded-lg text-sm font-medium transition nav-item ${currentCountryKey==='__global'?'active':'text-gray-400 hover:text-white hover:bg-gray-900'}`;
            globalBtn.onclick=()=>switchCountry('__global');
            globalBtn.innerHTML=`<span class="flex items-center gap-2.5"><span>🌐</span><span>Panel Macro Global</span></span><i class="fa-solid fa-chevron-right text-xs opacity-40"></i>`;
            nav.appendChild(globalBtn);

            const sep=document.createElement('div');
            sep.className='text-[10px] font-semibold text-gray-600 uppercase tracking-wider px-2 py-3';
            sep.textContent='Economías';
            nav.appendChild(sep);

            const mobileGlobal=document.createElement('option');
            mobileGlobal.value='__global';
            mobileGlobal.textContent='🌐 Panel Macro Global';
            mobileGlobal.selected=currentCountryKey==='__global';
            mobileSelect.appendChild(mobileGlobal);

            Object.entries(macroDatabase).forEach(([key,c])=>{
                if(!c || key.startsWith('__') || !c.id) return;
                const btn=document.createElement('button');
                btn.className=`w-full flex items-center justify-between px-3 py-2.5 rounded-lg text-sm font-medium transition nav-item ${key===currentCountryKey?'active':'text-gray-400 hover:text-white hover:bg-gray-900'}`;
                btn.onclick=()=>switchCountry(key);
                btn.innerHTML=`<span class="flex items-center gap-2.5"><span>${c.flag||'🌎'}</span><span>${esc(c.name||key)}</span></span><i class="fa-solid fa-chevron-right text-xs opacity-40"></i>`;
                nav.appendChild(btn);

                const opt=document.createElement('option');
                opt.value=key;
                opt.textContent=`${c.flag||'🌎'} ${c.name||key}`;
                opt.selected=key===currentCountryKey;
                mobileSelect.appendChild(opt);
            });
            mobileSelect.onchange=e=>switchCountry(e.target.value);
        }

        function switchCountry(key) {
            currentCountryKey = key;
            renderSidebar();
            renderContent();
            window.scrollTo({top:0,behavior:'smooth'});
        }

        function renderTopTabs(){
            const el=document.getElementById('topTabs');
            if(!el) return;
            const global=currentCountryKey==='__global';
            const tabs=global?[
              ['sec-resumen','PANEL GLOBAL'],['sec-risk','RISK ON/OFF'],['sec-fx','DIVISAS / CARRY'],
              ['sec-cot','COT'],['sec-options','OPCIONES / GAMMA'],['sec-darkpool','DARK POOLS / OTC'],['sec-rotation','MERCADOS & ROTACIÓN'],['sec-sentiment','SENTIMIENTO / BONOS']
            ]:[
              ['sec-tipos','TIPOS'],['sec-conferencia','RUEDA DE PRENSA'],['sec-bonos','CURVA'],
              ['sec-indicadores','INDICADORES']
            ];
            el.innerHTML=tabs.map(([id,label],i)=>`<button class="tab-btn ${i===0?'active':''} pb-3 whitespace-nowrap" onclick="scrollToSection('${id}')">${label}</button>`).join('');
        }

        function esc(v){ return String(v ?? '').replace(/[&<>\"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c])); }

        function toneScore(tone=''){

        function parseNum(v){
            if(v===null || v===undefined || v==='') return NaN;
            const s=String(v).replace(/\s/g,'').replace(/,/g,'.').replace(/%/g,'').replace(/K/gi,'e3').replace(/M/gi,'e6').replace(/B/gi,'e9');
            const n=Number(s);
            return Number.isFinite(n) ? n : NaN;
        }

        function importanceWeight(imp=''){
            const n=(String(imp).match(/★/g)||[]).length;
            return n ? n : 1;
        }

        function indicatorMeta(ind){
            const name=(ind.name||'').toLowerCase();
            const cat=(ind.cat||ind.category||'').toUpperCase();
            let higherIsHawkish=true;
            let importance=1;
            if(/desempleo|paro|jobless|claims|initial|continuing/.test(name)) higherIsHawkish=false;
            if(/participación|participation|horas trabajadas/.test(name)) higherIsHawkish=true;
            if(/inflación|ipc|cpi|pce|ppi|precios|wage|salario|salarios|expectativas de inflación/.test(name)) higherIsHawkish=true;
            if(/pib|gdp|pmi|ventas minoristas|retail|producción industrial|industrial production/.test(name)) higherIsHawkish=true;
            const w=importanceWeight(ind.imp);
            importance = w>=3 ? 1.35 : w===2 ? 1.15 : 1;
            return {higherIsHawkish, importance, cat};
        }

        function indicatorDirection(ind){
            const actual=parseNum(ind.actual), est=parseNum(ind.est);
            if(!Number.isFinite(actual) || !Number.isFinite(est)) return {score:0,label:'Sin cálculo',delta:NaN,meta:indicatorMeta(ind)};
            const meta=indicatorMeta(ind);
            const delta=actual-est;
            // No sobrerreaccionar a una diferencia mínima: el dato queda "en línea".
            const tolerance = Math.max(1e-9, Math.abs(est)*0.0025);
            if(Math.abs(delta)<=tolerance) return {score:0,label:'En línea →',delta,meta};
            const direction=(delta>0?1:-1)*(meta.higherIsHawkish?1:-1);
            const magnitude=Math.min(1.5, Math.max(0.35, Math.abs(delta)/(Math.abs(est)||1)*2.5));
            const score=direction*magnitude*meta.importance;
            return {score,label:score>0?'Presiona tipos ↑':'Alivia tipos ↓',delta,meta};
        }

        function groupRead(score){
            if(score>=1.1) return {label:'Hawkish ↑', cls:'effect-hawkish'};
            if(score<=-1.1) return {label:'Dovish ↓', cls:'effect-dovish'};
            return {label:'Mixta →', cls:'effect-neutral'};
        }

        function toneScore(tone=''){
            const s=String(tone).toLowerCase();
            if(/hawkish|restrictivo|restrictiva|endurec/.test(s) && !/dovish/.test(s)) return 1;
            if(/dovish|acomodatic|expansiv|flexible/.test(s)) return -1;
            return 0;
        }

        function macroInterpretation(data){
            const inds=data.indicators||[];
            const groups={inflation:0,employment:0,growth:0};
            const contributors=[];
            for(const ind of inds){
                const d=indicatorDirection(ind);
                if(d.score===0) continue;
                const cat=(ind.cat||'').toUpperCase();
                if(cat.includes('INFL')) groups.inflation += d.score;
                else if(cat.includes('EMPLEO')) groups.employment += d.score;
                else if(cat.includes('CREC') || cat.includes('ACTIV')) groups.growth += d.score;
                contributors.push({name:ind.name, score:d.score, label:d.label, cat, abs:Math.abs(d.score)});
            }
            const central=toneScore(data.conference?.tone || data.rates?.postureText);

            // Las expectativas se leen por dirección neta, no por "probabilidad de subida" aislada.
            let exp=0, expWeight=0;
            (data.rates?.expectations||[]).forEach(e=>{
                const v=parseNum(e.value); if(!Number.isFinite(v)) return;
                const l=(e.label||'').toLowerCase();
                let dir=0;
                if(l.includes('subida')) dir=1;
                else if(l.includes('bajada')) dir=-1;
                if(dir){ exp += dir*(v/100); expWeight += v/100; }
            });
            const expSignal=exp*2.0;

            // El 2Y es confirmación de mercado, no el conductor principal.
            let bond=0;
            const t2=(data.bonds?.tenors||[]).find(t=>t.term==='2Y');
            if(t2){ const ch=parseNum(t2.change); if(Number.isFinite(ch)) bond=Math.max(-0.7,Math.min(0.7,ch/4)); }

            // Política monetaria: pondera inflación > empleo > crecimiento, con el banco central como ancla.
            const policy = central*1.9 + groups.inflation*0.95 + groups.employment*0.65 + groups.growth*0.35 + expSignal*0.75 + bond*0.45;
            const score=Math.max(-5,Math.min(5,policy));

            // La confianza cae cuando los grupos importantes se contradicen.
            const vals=[groups.inflation,groups.employment,groups.growth,central,expSignal,bond].filter(v=>Math.abs(v)>0.05);
            const pos=vals.filter(v=>v>0).length, neg=vals.filter(v=>v<0).length;
            const conflict=vals.length ? Math.min(pos,neg)/Math.max(1,vals.length) : 0;
            const strength=Math.min(1,Math.abs(score)/3.4);
            let confidence=Math.round(48 + strength*42 - conflict*28);
            confidence=Math.max(25,Math.min(88,confidence));

            let label='Mixto / neutral →';
            if(score>=2.6) label='Claramente hawkish ↑';
            else if(score>=0.9) label='Moderadamente hawkish ↑';
            else if(score<=-2.6) label='Claramente dovish ↓';
            else if(score<=-0.9) label='Moderadamente dovish ↓';

            contributors.sort((a,b)=>b.abs-a.abs);
            const positives=contributors.filter(x=>x.score>0).slice(0,3);
            const negatives=contributors.filter(x=>x.score<0).sort((a,b)=>a.score-b.score).slice(0,3);
            return {score,label,central,exp:expSignal,bond,groups,confidence,positives,negatives,conflict};
        }

        function effectForIndicator(ind){
            const d=indicatorDirection(ind);
            let cls='effect-neutral';
            if(d.score>0) cls='effect-hawkish';
            if(d.score<0) cls='effect-dovish';
            return `<span class="${cls} font-semibold">${esc(d.label)}</span>`;
        }

        function findCatalogMatch(data, itemName){
            const all=[...(data.indicators||[])];
            const q=itemName.toLowerCase();
            return all.find(i => {
                const n=(i.name||'').toLowerCase();
                if(q==='nfp') return /nóminas|nfp|nonfarm/.test(n);
                if(q==='pce') return /pce/.test(n) && !/subyacente|core/.test(q);
                if(q==='pce subyacente') return /pce/.test(n) && /subyacente|core/.test(n);
                if(q==='cpi subyacente') return /cpi|ipc/.test(n) && /subyacente|core/.test(n);
                if(q==='cpi (ipc) general') return /cpi|ipc/.test(n) && !/subyacente|core/.test(n);
                if(q==='desempleo' || q==='tasa de desempleo') return /desempleo|paro|unemployment/.test(n);
                if(q==='pib') return /pib|gdp/.test(n);
                if(q==='ism manufacturing') return /ism.*manufactur|manufactur.*ism/.test(n);
                if(q==='ism services') return /ism.*servic|servic.*ism/.test(n);
                if(q==='ppi') return /ppi|ipp/.test(n);
                return n.includes(q);
            });
        }

        function renderCurveChart(data){
            const pts=(data.bonds?.tenors||[]).map(t=>({term:t.term,y:parseNum(t.yield)})).filter(p=>Number.isFinite(p.y));
            if(pts.length<2) return `<div class="curve-wrap text-xs text-gray-500">Sin suficientes vencimientos para dibujar la curva.</div>`;
            const W=900,H=300,L=48,R=22,T=18,B=48;
            const ys=pts.map(p=>p.y), minY=Math.min(...ys), maxY=Math.max(...ys);
            const pad=Math.max((maxY-minY)*0.18,0.08), lo=minY-pad, hi=maxY+pad;
            const x=i=>L+i*(W-L-R)/(pts.length-1);
            const y=v=>T+(hi-v)*(H-T-B)/(hi-lo);
            const poly=pts.map((p,i)=>`${x(i)},${y(p.y)}`).join(' ');
            const ticks=[0.25,0.5,0.75].map(f=>lo+(hi-lo)*f);
            const grid=ticks.map(v=>`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" class="curve-grid"/><text x="${L-8}" y="${y(v)+3}" text-anchor="end" class="curve-axis">${v.toFixed(2)}%</text>`).join('');
            const labels=pts.map((p,i)=>`<text x="${x(i)}" y="${H-24}" text-anchor="middle" class="curve-axis">${esc(p.term)}</text><circle cx="${x(i)}" cy="${y(p.y)}" r="4.5" class="curve-dot"/><text x="${x(i)}" y="${y(p.y)-10}" text-anchor="middle" class="curve-axis">${p.y.toFixed(2)}%</text>`).join('');
            return `<div class="curve-wrap"><svg class="curve-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="Curva de rendimientos"><line x1="${L}" x2="${L}" y1="${T}" y2="${H-B}" class="curve-grid"/><line x1="${L}" x2="${W-R}" y1="${H-B}" y2="${H-B}" class="curve-grid"/>${grid}<polyline points="${poly}" class="curve-line"/>${labels}</svg><div class="mt-2 text-[10px] text-gray-500">Rendimiento por vencimiento. La forma y su cambio se interpretan junto con 2Y/10Y y las expectativas de tipos.</div></div>`;

        function fmtCompactMoney(v){ const n=Number(v); if(!Number.isFinite(n)) return '—'; const a=Math.abs(n); const sign=n<0?'-':''; if(a>=1e9) return sign+(a/1e9).toFixed(2)+'B'; if(a>=1e6) return sign+(a/1e6).toFixed(1)+'M'; if(a>=1e3) return sign+(a/1e3).toFixed(0)+'K'; return sign+a.toFixed(0); }

        function fmtPct(v,d=2){ const n=Number(v); return Number.isFinite(n)?(n>=0?'+':'')+n.toFixed(d)+'%':'—'; }
        function fmtNum(v,d=2){ const n=Number(v); return Number.isFinite(n)?n.toFixed(d):'—'; }
        function fxBiasLabel(score){ if(score>=2) return 'Muy alcista'; if(score>=0.9) return 'Alcista'; if(score>=0.35) return 'Levemente alcista'; if(score<=-2) return 'Muy bajista'; if(score<=-0.9) return 'Bajista'; if(score<=-0.35) return 'Levemente bajista'; return 'Neutral'; }
        function fxBiasClass(score){ return score>0.35?'bias-up':score<-0.35?'bias-down':'bias-flat'; }
        function parseRate(v){ const s=String(v??'').replace(',','.').replace('%','').replace('–','-'); const nums=s.match(/-?\d+(?:\.\d+)?/g); if(!nums) return NaN; return nums.length===2?(Number(nums[0])+Number(nums[1]))/2:Number(nums[0]); }
        function buildFxComparator(){
            const fx=macroDatabase.__fx||{currencies:{}};
            const all=Object.values(macroDatabase).filter(d=>d&&d.id);
            const rows=all.map(d=>{ const code=d.id==='us'?'USD':d.id==='eu'||d.id==='de'?'EUR':d.id==='uk'?'GBP':d.id==='jp'?'JPY':d.id==='au'?'AUD':d.id==='nz'?'NZD':d.id==='ca'?'CAD':'CHF'; const m=fx.currencies?.[code]||{}; return {id:d.id,code,name:d.name,pol:macroInterpretation(d).score,rate:parseRate(d.rates?.official),y2:parseRate((d.bonds?.tenors||[]).find(x=>x.term==='2Y')?.yield),real:parseRate(d.rates?.real),tr5:Number(m.change5d)||0,tr20:Number(m.change20d)||0}; });
            const by=Object.fromEntries(rows.map(x=>[x.code,x]));
            function score(a,b){ const A=by[a],B=by[b]; if(!A||!B) return 0; return 0.95*(A.pol-B.pol)+0.75*((A.y2||0)-(B.y2||0))+0.45*((A.real||0)-(B.real||0))+0.32*(A.tr5-B.tr5)+0.14*(A.tr20-B.tr20); }
            const vsUsd=['EUR','GBP','JPY','AUD','NZD','CAD','CHF'].map(c=>{const x=by[c]; const sc=score(c,'USD'); return {...x,score:sc,label:fxBiasLabel(sc)};});
            const codes=['EUR','GBP','JPY','AUD','NZD','CAD','CHF','USD']; const matrix=codes.map(base=>({base,cols:codes.map(q=>base===q?null:score(base,q))}));
            return {updated:fx.updated||'—',rows:vsUsd,matrix};
        }
        function renderFxComparator(){

            return `<section id="sec-fx" class="space-y-4"><div class="glass rounded-2xl p-5"><div class="flex items-center justify-between gap-3"><div><div class="text-[10px] uppercase tracking-wider text-gray-500">Algoritmo personalizado</div><h2 class="text-xl font-black text-white mt-1">DIVISAS · CARRY + TIPOS + TENDENCIA</h2><p class="text-sm text-gray-400 mt-1 max-w-4xl">Combina postura monetaria, diferencial de tipos, 2Y, tipo real y tendencia de 5/20 sesiones. El carry es un proxy; no sustituye forwards u OIS.</p></div><span class="mini-pill">${esc(fx.updated)}</span></div></div><div class="card rounded-2xl p-4 overflow-x-auto"><table class="w-full"><thead><tr class="border-b border-gray-800"><th class="py-2 px-3 text-left text-[10px] text-gray-500">Moneda</th><th class="py-2 px-3 text-left text-[10px] text-gray-500">Nombre</th><th class="py-2 px-3 text-left text-[10px] text-gray-500">Tipo</th><th class="py-2 px-3 text-left text-[10px] text-gray-500">2Y</th><th class="py-2 px-3 text-left text-[10px] text-gray-500">5D</th><th class="py-2 px-3 text-left text-[10px] text-gray-500">20D</th><th class="py-2 px-3 text-left text-[10px] text-gray-500">Sesgo vs USD</th></tr></thead><tbody>${rows}</tbody></table></div><div class="metric rounded-xl p-4 overflow-x-auto"><div class="text-[10px] uppercase tracking-wider text-gray-500 mb-3">Matriz de sesgo relativo</div><table class="w-full"><thead><tr><th class="py-2 px-2 text-left text-[10px] text-gray-600">Base \\ Cta.</th>${heads}</tr></thead><tbody>${matrix}</tbody></table></div></section>`;

        function renderRotationSection(){
            const r=macroDatabase.__rotation||{sectors:[],styles:[],sentimentTraditional:{}};
            const rows=(r.sectors||[]).map(x=>`<tr class="border-b border-gray-900/70"><td class="py-2 px-2 text-xs font-semibold text-white">${esc(x.name)}</td><td class="text-xs ${x.change1d>=0?'risk-up':'risk-down'}">${fmtPct(x.change1d)}</td><td class="text-xs ${x.change1w>=0?'risk-up':'risk-down'}">${fmtPct(x.change1w)}</td><td class="text-xs ${x.change1m>=0?'risk-up':'risk-down'}">${fmtPct(x.change1m)}</td><td class="text-xs ${x.vsSpy1w>=0?'risk-up':'risk-down'}">${fmtPct(x.vsSpy1w)}</td></tr>`).join('');

                        </table>
                    </div>
                    <div class="mt-4 pt-3 border-t border-gray-800 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2 text-[11px] text-gray-500">
                        <span>Última actualización visible: ${esc(data.updated || 'Datos de referencia')} · Interpretación automática basada en datos disponibles</span>
                        <span>Fuente: <a class="source-link" href="${esc(data.sourceUrl || '#')}" target="_blank" rel="noopener">${esc(data.sourceName || 'fuente oficial')}</a></span>
                    </div>
            </div>
            `;
        }

        function scrollToSection(id) {
            const el = document.getElementById(id);
            if (el) el.scrollIntoView({ behavior: 'smooth' });
        }

        // El archivo macro-feed.json debe permanecer en la misma carpeta que este HTML.
        // En HTTP/HTTPS se recarga al abrir y cada 15 min; en file:// se usa el respaldo interno.
                async function loadExternalFeed(){
            if(!['http:','https:'].includes(location.protocol)){
                setFeedStatus('Modo local · usando datos integrados', false);
                return false;
            }
            try{
                const res=await fetch('./macro-feed.json?ts='+Date.now(), {cache:'no-store'});
                if(!res.ok) throw new Error('feed no disponible');
                const feed=await res.json();
                if(feed && feed.economies){
                    Object.entries(feed.economies).forEach(([k,v])=>{
                        if(!macroDatabase[k]) macroDatabase[k]={};
                        macroDatabase[k]={...macroDatabase[k],...v};
                        if(v.rates) macroDatabase[k].rates={...macroDatabase[k].rates,...v.rates};
                        if(v.conference) macroDatabase[k].conference={...macroDatabase[k].conference,...v.conference};
                        if(v.bonds) macroDatabase[k].bonds={...macroDatabase[k].bonds,...v.bonds};
                        if(Array.isArray(v.indicators) && v.indicators.length) macroDatabase[k].indicators=v.indicators;
                    });
                    if(feed.riskOnOff) macroDatabase.__riskOnOff = feed.riskOnOff;
                    if(feed.cot) macroDatabase.__cot = feed.cot;
                    if(feed.options) macroDatabase.__options = feed.options;
                    if(feed.fx) macroDatabase.__fx = feed.fx;
                    if(feed.darkPools) macroDatabase.__darkPools = feed.darkPools;
                    if(feed.rotation) macroDatabase.__rotation = feed.rotation;
                    if(feed.cryptoSentiment) macroDatabase.__cryptoSentiment = feed.cryptoSentiment;
                    if(feed.bondMarket) macroDatabase.__bondMarket = feed.bondMarket;
                    setFeedStatus('Feed externo sincronizado', true);
                    renderSidebar();
                    renderContent();
                    return true;
                }
            }catch(e){
                setFeedStatus('Feed externo no disponible · usando respaldo local', false);
            }
            return false;
        }

        function setFeedStatus(text, ok){
            const s=document.getElementById('feedStatus');
            const d=document.getElementById('feedDot');
            if(s) s.textContent=text;
            if(d) d.className='w-2 h-2 rounded-full '+(ok?'bg-green-500':'bg-yellow-500');
        }

        function manualRefresh(){
            setFeedStatus('Buscando feed…', false);
            loadExternalFeed();
        }

        macroDatabase.__riskOnOff = macroDatabase.__riskOnOff || {label:'SIN SINCRONIZAR',score:null,confidence:null,assets:[],confirmations:[],tensions:[],updated:'—'};
        macroDatabase.__cot = macroDatabase.__cot || {updated:'—',markets:[]};
        macroDatabase.__options = macroDatabase.__options || {updated:'—',markets:[]};
        macroDatabase.__fx = macroDatabase.__fx || {updated:'—',currencies:{}};
        macroDatabase.__darkPools = macroDatabase.__darkPools || {updated:'—',markets:[]};
        macroDatabase.__rotation = macroDatabase.__rotation || {updated:'—',sectors:[],styles:[],sentimentTraditional:{}};
        macroDatabase.__cryptoSentiment = macroDatabase.__cryptoSentiment || {};
        macroDatabase.__bondMarket = macroDatabase.__bondMarket || {markets:[]};

        // Inicializar al cargar la página
        window.addEventListener('DOMContentLoaded', () => {
            renderSidebar();
            renderContent();
            setTimeout(loadExternalFeed, 200);
            setInterval(loadExternalFeed, 15*60*1000);
        });
    </script>
</body>
</html>
