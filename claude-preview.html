        function expectationsAreFresh(data,maxAgeDays=7){
 const raw=data?.rates?.expectationsUpdated||data?.rates?.expectationsDate||data?.rates?.expectationsTimestamp;
 if(!data?.rates?.expectationsSource || !/^https:\/\//.test(data?.rates?.expectationsUrl||''))return false;
 const values=(data?.rates?.expectations||[]).map(e=>parseNum(e.value));
 if(!values.length || values.some(v=>!Number.isFinite(v)||v<0||v>100) || Math.abs(values.reduce((a,b)=>a+b,0)-100)>1)return false;
 if(raw===null||raw===undefined||raw==='')return false;
 const stamp=typeof raw==='number'?(raw<1000000000000?raw*1000:raw):Date.parse(String(raw));
 if(!Number.isFinite(stamp))return false;
 const age=Date.now()-stamp;
 return age>=-86400000&&age<=maxAgeDays*86400000;
}

        }

        function parseNum(v){
            if(v===null || v===undefined || v==='') return NaN;
            const s=String(v).replace(/\s/g,'').replace(/,/g,'.').replace(/%/g,'').replace(/K/gi,'e3').replace(/M/gi,'e6').replace(/B/gi,'e9');
            const n=Number(s);
            return Number.isFinite(n) ? n : NaN;
        }

        function importanceWeight(imp=''){
            const n=(String(imp).match(/★/g)||[]).length;
            return n ? n : 1;
        }

        function indicatorMeta(ind){
            const name=(ind.name||'').toLowerCase();
            const cat=(ind.cat||ind.category||'').toUpperCase();
            let higherIsHawkish=true;
            let importance=1;
            if(/desempleo|paro|unemployment|unemploy|jobless|claims|initial|continuing/.test(name)) higherIsHawkish=false;
            if(/participación|participation|horas trabajadas/.test(name)) higherIsHawkish=true;
            if(/inflación|ipc|cpi|pce|ppi|precios|wage|salario|salarios|expectativas de inflación/.test(name)) higherIsHawkish=true;
            if(/pib|gdp|pmi|ventas minoristas|retail|producción industrial|industrial production/.test(name)) higherIsHawkish=true;
            const w=importanceWeight(ind.imp);
            importance = w>=3 ? 1.35 : w===2 ? 1.15 : 1;
            return {higherIsHawkish, importance, cat};
        }

        function indicatorDirection(ind){
            const actual=parseNum(ind.actual), est=parseNum(ind.est);
            if(!Number.isFinite(actual) || !Number.isFinite(est)) return {score:0,label:'Sin cálculo',delta:NaN,meta:indicatorMeta(ind)};
            const meta=indicatorMeta(ind);
            const delta=actual-est;
            // No sobrerreaccionar a una diferencia mínima: el dato queda "en línea".
            const tolerance = Math.max(1e-9, Math.abs(est)*0.0025);
            if(Math.abs(delta)<=tolerance) return {score:0,label:'En línea →',delta,meta};
            const direction=(delta>0?1:-1)*(meta.higherIsHawkish?1:-1);
            const magnitude=Math.min(1.5, Math.max(0.35, Math.abs(delta)/(Math.abs(est)||1)*2.5));
            const score=direction*magnitude*meta.importance;
            return {score,label:score>0?'Presiona tipos ↑':'Alivia tipos ↓',delta,meta};
        }

        function groupRead(score){
            if(score>=1.1) return {label:'Hawkish ↑', cls:'effect-hawkish'};
            if(score<=-1.1) return {label:'Dovish ↓', cls:'effect-dovish'};
            return {label:'Mixta →', cls:'effect-neutral'};
        }

        function toneScore(tone=''){
            const s=String(tone).toLowerCase();
            if(/hawkish|restrictivo|restrictiva|endurec/.test(s) && !/dovish/.test(s)) return 1;
            if(/dovish|acomodatic|expansiv|flexible/.test(s)) return -1;
            return 0;
        }

        function macroInterpretation(data){
            const staleDaysForIndicator=(ind)=>{
                const cat=String(ind?.cat||'').toUpperCase();
                // Quarterly activity can remain informative longer than weekly labour data.
                if(/claims|solicitudes|subsidio/i.test(ind?.name||'')) return 14;
                if(/pib|gdp/i.test(ind?.name||'')) return 125;
                if(cat.includes('CREC')) return 65;
                if(cat.includes('INFL')) return 75;
                if(cat.includes('EMPLEO')) return 75;
                return 90;
            };
            const dated=(ind)=>{const t=Date.parse(String(ind?.publishedAt||ind?.releaseDate||ind?.date||'')); return Number.isFinite(t)&&t<=Date.now()+86400000&&t>=Date.now()-staleDaysForIndicator(ind)*86400000;};
            const allIndicators=data.indicators||[];
            const inds=allIndicators.filter(dated);
            const groups={inflation:0,employment:0,growth:0};
            const contributors=[];
            for(const ind of inds){
                const d=indicatorDirection(ind);
                if(d.score===0) continue;
                const cat=(ind.cat||'').toUpperCase();
                if(cat.includes('INFL')) groups.inflation += d.score;
                else if(cat.includes('EMPLEO')) groups.employment += d.score;
                else if(cat.includes('CREC') || cat.includes('ACTIV')) groups.growth += d.score;
                contributors.push({name:ind.name, score:d.score, label:d.label, cat, abs:Math.abs(d.score)});
            }
            const centralDate=Date.parse(String(data.conference?.date||''));
            const centralFresh=!/pendiente|sin clasificar|sin clasificación/i.test(data.conference?.tone||'Sin clasificar')&&Number.isFinite(centralDate)&&centralDate<=Date.now()+86400000&&centralDate>=Date.now()-150*86400000;
            const central=centralFresh?toneScore(data.conference?.tone || data.rates?.postureText):0;

            // Las expectativas se leen por dirección neta, no por "probabilidad de subida" aislada.
            let exp=0, expWeight=0;
            const verifiedExpectations=expectationsAreFresh(data)?(data.rates?.expectations||[]):[];
            verifiedExpectations.forEach(e=>{
                const v=parseNum(e.value); if(!Number.isFinite(v)) return;
                const l=(e.label||'').toLowerCase();
                let dir=0;
                if(l.includes('subida')) dir=1;
                else if(l.includes('bajada')) dir=-1;
                if(dir){ exp += dir*(v/100); expWeight += v/100; }
            });
            const expSignal=exp*2.0;

            // El 2Y es confirmación de mercado, no el conductor principal.
            let bond=0;
            const t2=(data.bonds?.tenors||[]).find(t=>t.term==='2Y');
            if(t2&&v7Fresh(t2.observedAt||data.bonds?.date,7)){ const ch=parseNum(t2.change1dBp); if(Number.isFinite(ch)) bond=Math.max(-0.7,Math.min(0.7,ch/4)); }

            // Política monetaria: pondera inflación > empleo > crecimiento, con el banco central como ancla.
            const policy = central*1.9 + groups.inflation*0.95 + groups.employment*0.65 + groups.growth*0.35 + expSignal*0.75 + bond*0.45;
            const score=Math.max(-5,Math.min(5,policy));

            // La confianza cae cuando los grupos importantes se contradicen.
            const vals=[groups.inflation,groups.employment,groups.growth,central,expSignal,bond].filter(v=>Math.abs(v)>0.05);
            const pos=vals.filter(v=>v>0).length, neg=vals.filter(v=>v<0).length;
            const conflict=vals.length ? Math.min(pos,neg)/Math.max(1,vals.length) : 0;
            const strength=Math.min(1,Math.abs(score)/3.4);
            let confidence=Math.round(48 + strength*42 - conflict*28);
            confidence=Math.max(25,Math.min(88,confidence));

            let label='Mixto / neutral →';
            if(score>=2.6) label='Claramente hawkish ↑';
            else if(score>=0.9) label='Moderadamente hawkish ↑';
            else if(score<=-2.6) label='Claramente dovish ↓';
            else if(score<=-0.9) label='Moderadamente dovish ↓';

            contributors.sort((a,b)=>b.abs-a.abs);
            const positives=contributors.filter(x=>x.score>0).slice(0,3);
            const negatives=contributors.filter(x=>x.score<0).sort((a,b)=>a.score-b.score).slice(0,3);
            const coverage={freshIndicators:inds.length,totalIndicators:allIndicators.length,centralFresh,centralDate:centralFresh?(data.conference?.date||'—'):null};
            if(coverage.freshIndicators===0&&!centralFresh&&verifiedExpectations.length===0) confidence=Math.min(confidence,35);
            return {score,label,central,exp:expSignal,bond,groups,confidence,positives,negatives,conflict,coverage};
        }

        function effectForIndicator(ind){
            const d=indicatorDirection(ind);
            let cls='effect-neutral';
            if(d.score>0) cls='effect-hawkish';
            if(d.score<0) cls='effect-dovish';
            return `<span class="${cls} font-semibold">${esc(d.label)}</span>`;
        }

        function findCatalogMatch(data, itemName){
            const all=[...(data.indicators||[])];
            const q=itemName.toLowerCase();

                        if(!macroDatabase[k]) macroDatabase[k]={};

                        if(v.rates) macroDatabase[k].rates={...macroDatabase[k].rates,...v.rates};
                        if(v.conference) macroDatabase[k].conference={...macroDatabase[k].conference,...v.conference};

                    Object.entries(map).forEach(([src,dst])=>{if(feed[src]!==undefined) macroDatabase[dst]=feed[src];});
                    macroDatabase.__feedMeta={updated:feed.updated||'—',source:url.includes('raw.githubusercontent')?'GitHub raw fallback':'GitHub Pages',loadedAt:new Date().toISOString()};

function drawETF(){

 setTimeout(()=>{
  const mk=(macroDatabase.__options&&macroDatabase.__options.markets)||[];

  const wk=r=>{const m={};r.forEach(x=>{const dt=new Date(x.d+'T00:00:00Z'),k=new Date(+dt-((dt.getUTCDay()+6)%7)*864e5).toISOString().slice(0,10);m[k]=(m[k]||0)+x.v;});return Object.entries(m).sort().map(e=>({d:e[0],v:e[1]}));};

 },350);
